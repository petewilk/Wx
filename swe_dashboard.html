<style>
  :root {
    --bg:#0d1117; --surface:#161b22; --border:#21262d;
    --accent:#58a6ff; --green:#3fb950; --muted:#8b949e;
    --text:#e6edf3; --danger:#f85149; --warn:#d29922;
  }
  html.light {
    --bg:#f6f8fa; --surface:#ffffff; --border:#d0d7de;
    --accent:#0969da; --green:#1a7f37; --muted:#636c76;
    --text:#1f2328; --danger:#cf222e; --warn:#9a6700;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:system-ui,monospace;font-size:13px;min-height:100vh}
  header{padding:20px 20px 14px;border-bottom:1px solid var(--border)}
  header h1{font-size:22px;font-weight:600;letter-spacing:-.5px}
  .sub{color:var(--muted);font-size:11px;margin-top:4px}
  .controls{padding:10px 20px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .controls label{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}
  select,button{background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:system-ui,monospace;font-size:11px;padding:4px 8px;border-radius:4px;cursor:pointer}
  #refreshBtn{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700;padding:5px 12px}
  #refreshBtn:disabled{opacity:.5}
  .year-toggles{display:flex;gap:4px;flex-wrap:wrap}
  .yr{padding:3px 6px;border-radius:3px;font-size:10px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-family:system-ui,monospace}
  .legend-bar{padding:7px 20px;border-bottom:1px solid var(--border);display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:10px;color:var(--muted)}
  .li{display:flex;align-items:center;gap:5px}
  .lline{width:20px;height:2px;border-radius:1px}
  .status{padding:4px 20px;border-bottom:1px solid var(--border);font-size:10px;color:var(--muted);min-height:20px}
  .grid{display:flex;flex-direction:column;gap:1px;background:var(--border)}
  .row-group{display:flex;flex-wrap:wrap;gap:1px;}
  .yr-toggles{display:flex;gap:4px;flex-wrap:wrap;padding:5px 0 2px;}
  input[type=text],input[type=number]{background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:system-ui,monospace;font-size:11px;padding:4px 8px;border-radius:4px;outline:none}
  .card{background:var(--surface);padding:14px 16px 10px}
  .card-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
  .sname{font-size:16px;font-weight:600}
  .smeta{font-size:10px;color:var(--muted);margin-top:2px}
  .swe-box{text-align:right;min-width:80px}
  .swe-num{font-size:18px;font-weight:700;color:var(--accent);line-height:1}
  .swe-unit{font-size:9px;color:var(--muted);text-transform:uppercase}
  .swe-pct{font-size:11px;margin-top:2px}
  .chart-wrap{position:relative;height:170px}
  .overlay{position:absolute;inset:0;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;z-index:10}
  .overlay.hidden{display:none}
  .spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .overlay-msg{font-size:11px;color:var(--muted);text-align:center;max-width:300px;line-height:1.5;padding:0 8px}
  .overlay-msg.err{color:var(--danger)}
  .card-ftr{margin-top:6px;display:flex;justify-content:space-between;align-items:center}
  .card-ftr a{font-size:10px;color:var(--accent);text-decoration:none}
  .upd{font-size:10px;color:var(--muted)}
  footer{padding:12px 20px;border-top:1px solid var(--border);color:var(--muted);font-size:10px;display:flex;gap:12px;flex-wrap:wrap}
  footer a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>

<header>
  <div style="font-size:22px;font-weight:600;letter-spacing:-.5px">SNOTEL SWE Dashboard</div>
  <div class="sub" id="sub">Snow Water Equivalent &middot; NRCS SNOTEL</div>
</header>

<div class="controls">
  <label>Zip:</label>
  <input type="text" id="zipInput" value="84109" maxlength="10" style="width:70px">
  <label>Radius&nbsp;(mi):</label>
  <input type="number" id="radiusInput" value="30" min="5" max="500" style="width:55px">
  <button onclick="loadStations()">&#128269; Find Stations</button>
  <span style="margin-left:4px"><label>Median: </label>
  <select id="medSel"><option value="1">Show</option><option value="0">Hide</option></select></span>
  <button id="refreshBtn" onclick="loadAll()" disabled>&#8635; Refresh</button>
</div>

<div class="legend-bar">
  <span>LEGEND:</span>
  <div class="li"><div class="lline" style="background:#58a6ff;height:3px"></div><span id="curWyLegend">Current WY</span></div>
  <div class="li"><div class="lline" style="background:#8b949e"></div>Prior years</div>
  <div class="li"><div class="lline" style="background:repeating-linear-gradient(90deg,#d29922 0,#d29922 4px,transparent 4px,transparent 8px)"></div>Median</div>
</div>

<div class="status" id="status">Loading&hellip;</div>
<div class="grid" id="grid"></div>

<footer>
  <span>Data: <a href="https://wcc.sc.egov.usda.gov/reportGenerator/" target="_blank">NRCS SNOTEL</a></span>
  <span>Interactive: <a href="https://www.cbrfc.noaa.gov/dbdata/station/swegraph/swegroup.html" target="_blank">CBRFC</a></span>
  <span id="ftTime"></span>
</footer>

// ── Constants ──────────────────────────────────────────────────────────────
// Water year runs Oct 1 - Sep 30 and is named for the year it ends in
var CUR_WY = (function() {
  var d = new Date();
  return d.getMonth() >= 9 ? d.getFullYear() + 1 : d.getFullYear();
})();
var ALL_WY = [];
for (var y = CUR_WY - 5; y <= CUR_WY; y++) ALL_WY.push(y);
var showMedian = true;
var STATIONS = [];
var stationState = {};

// Prior years oldest -> newest, then current year
var WY_SHADES = ['#3a5e70', '#4a7085', '#5a8ca0', '#80afc4', '#aed0e2', '#58a6ff'];
var WY_COLOR = {};
ALL_WY.forEach(function(wy, i) { WY_COLOR[wy] = WY_SHADES[i]; });

// ── Haversine distance (miles) ─────────────────────────────────────────────
function haversine(lat1, lon1, lat2, lon2) {
  var R = 3958.8;
  var dLat = (lat2 - lat1) * Math.PI / 180;
  var dLon = (lon2 - lon1) * Math.PI / 180;
  var a = Math.sin(dLat/2)*Math.sin(dLat/2) +
          Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
          Math.sin(dLon/2)*Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ── Zip geocoding via zippopotam.us ────────────────────────────────────────
function geocodeZip(zip) {
  return fetch('https://api.zippopotam.us/us/' + encodeURIComponent(zip))
    .then(function(r) {
      if (!r.ok) throw new Error('Zip not found: ' + zip);
      return r.json();
    })
    .then(function(j) {
      var p = j.places && j.places[0];
      if (!p) throw new Error('No location for zip ' + zip);
      return {
        lat:   parseFloat(p.latitude),
        lon:   parseFloat(p.longitude),
        city:  p['place name'],
        state: p['state abbreviation']
      };
    });
}

// ── Station discovery ──────────────────────────────────────────────────────
function loadStations() {
  var zip    = (document.getElementById('zipInput').value || '84109').trim();
  var radius = parseFloat(document.getElementById('radiusInput').value) || 30;
  var btn    = document.getElementById('refreshBtn');
  btn.disabled = true;
  document.getElementById('status').textContent = 'Geocoding ' + zip + '\u2026';

  geocodeZip(zip)
    .then(function(center) {
      document.getElementById('status').textContent = 'Filtering stations\u2026';
      STATIONS = SNTL_ALL
        .map(function(s) {
          return {
            siteNum:   s.id,
            name:      s.n,
            elevation: s.e,
            lat:       s.lat,
            lon:       s.lon,
            stateCode: s.st,
            dist:      haversine(center.lat, center.lon, s.lat, s.lon)
          };
        })
        .filter(function(s) { return s.dist <= radius; })
        .sort(function(a, b) { return b.elevation - a.elevation; });

      if (!STATIONS.length) {
        document.getElementById('status').textContent =
          'No SNOTEL stations found within ' + radius + ' miles of ' + zip;
        btn.disabled = false;
        return;
      }

      var loc = center.city ? center.city + ', ' + center.state : zip;
      document.getElementById('sub').textContent =
        'Snow Water Equivalent \u00b7 ' + radius + '-mile radius of ' + zip +
        ' (' + loc + ') \u00b7 NRCS SNOTEL \u00b7 ' + STATIONS.length + ' stations';

      renderGrid();
      loadAll();
    })
    .catch(function(e) {
      document.getElementById('status').textContent = 'Error: ' + e.message;
      btn.disabled = false;
    });
}

// ── Elevation band grouping ────────────────────────────────────────────────
function groupByElevation(stations, bandFt) {
  var groups = [], cur = [];
  stations.forEach(function(s) {
    if (!cur.length || cur[0].elevation - s.elevation <= bandFt) {
      cur.push(s);
    } else {
      groups.push(cur);
      cur = [s];
    }
  });
  if (cur.length) groups.push(cur);
  return groups;
}

// ── Build card grid ────────────────────────────────────────────────────────
function renderGrid() {
  var g = document.getElementById('grid');
  g.innerHTML = '';
  stationState = {};
  STATIONS.forEach(function(s) {
    stationState[s.siteNum] = { activeYears: new Set([CUR_WY]), yearData: {}, medianData: [] };
  });
  groupByElevation(STATIONS, 800).forEach(function(group) {
    var row = document.createElement('div');
    row.className = 'row-group';
    group.forEach(function(s) { row.appendChild(makeCard(s)); });
    g.appendChild(row);
  });
}

// ── Date utilities ────────────────────────────────────────────────────────
function dateToDOY(dateStr) {
  var d   = new Date(dateStr + 'T12:00:00');
  var yr  = d.getMonth() >= 9 ? d.getFullYear() : d.getFullYear() - 1;
  var oct = new Date(yr, 9, 1);
  return Math.round((d - oct) / 86400000) + 1;
}
function doyLabel(doy) {
  var d = new Date(2023, 9, 1);
  d.setDate(d.getDate() + doy - 1);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
// ── Compute default active years (high / low / median peak SWE) ────────────
function computeDefaultYears(yearData) {
  var peaks = {};
  ALL_WY.forEach(function(wy) {
    if (wy === CUR_WY) return;
    var rows = yearData[wy] || [];
    if (!rows.length) return;
    peaks[wy] = Math.max.apply(null, rows.map(function(r) { return r.v; }));
  });
  var wys = Object.keys(peaks).map(Number);
  if (!wys.length) return new Set([CUR_WY]);
  wys.sort(function(a, b) { return peaks[b] - peaks[a]; });
  var highYear = wys[0];
  var lowYear  = wys[wys.length - 1];
  var sorted   = wys.slice().sort(function(a, b) { return peaks[a] - peaks[b]; });
  var medYear  = sorted[Math.floor(sorted.length / 2)];
  var result   = new Set([CUR_WY, highYear, lowYear]);
  if (medYear !== highYear && medYear !== lowYear) result.add(medYear);
  return result;
}

// ── Fetch all years for a station ─────────────────────────────────────────
function fetchStation(s) {
  var today   = new Date().toISOString().slice(0, 10);
  var startWY = Math.min.apply(null, ALL_WY);
  var url = 'https://wcc.sc.egov.usda.gov/awdbRestApi/services/v1/data' +
    '?stationTriplets=' + s.siteNum + ':' + s.stateCode + ':SNTL' +
    '&elements=WTEQ' +
    '&beginDate=' + (startWY - 1) + '-10-01' +
    '&endDate=' + today +
    '&duration=DAILY' +
    '&centralTendencyType=ALL' +
    '&returnFlags=false';

  return fetch(url)
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(json) {
      var values = json[0].data[0].values;
      var years = {};
      var medianByDoy = {};
      ALL_WY.forEach(function(wy) { years[wy] = []; });

      values.forEach(function(v) {
        if (v.value === null || v.value === undefined) return;
        var doy = dateToDOY(v.date);
        var d   = new Date(v.date + 'T12:00:00');
        var wy  = d.getMonth() >= 9 ? d.getFullYear() + 1 : d.getFullYear();
        if (years[wy]) years[wy].push({ date: v.date, doy: doy, v: v.value });
        if (showMedian && v.median != null && !medianByDoy[doy]) {
          medianByDoy[doy] = v.median;
        }
      });

      var medianRows = showMedian
        ? Object.keys(medianByDoy).map(Number).sort(function(a, b) { return a - b; })
            .map(function(doy) { return { doy: doy, v: medianByDoy[doy] }; })
        : [];

      var st = stationState[s.siteNum];
      if (st) {
        st.yearData    = years;
        st.medianData  = medianRows;
        st.activeYears = computeDefaultYears(years);
      }

      var curRows   = years[CUR_WY] || [];
      var lastPoint = curRows.length ? curRows[curRows.length - 1] : null;
      var currentSWE  = lastPoint ? lastPoint.v    : null;
      var currentDate = lastPoint ? lastPoint.date : null;

      var pctMedian = null;
      if (currentSWE !== null && lastPoint && medianRows.length) {
        var best = null, bestDiff = 9999;
        for (var i = 0; i < medianRows.length; i++) {
          var diff = Math.abs(medianRows[i].doy - lastPoint.doy);
          if (diff < bestDiff) { bestDiff = diff; best = medianRows[i]; }
        }
        if (best && best.v > 0) pctMedian = Math.round((currentSWE / best.v) * 100);
      }
      return { currentSWE: currentSWE, currentDate: currentDate, pctMedian: pctMedian };
    });
}

// ── Chart rendering ────────────────────────────────────────────────────────
var charts = {};

function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function renderChart(sid, siteNum) {
  if (charts[sid]) { charts[sid].destroy(); delete charts[sid]; }
  var st = stationState[siteNum];
  if (!st) return;

  var mutedColor  = cssVar('--muted');
  var borderColor = cssVar('--border');
  var surfColor   = cssVar('--surface');
  var textColor   = cssVar('--text');
  var warnColor   = cssVar('--warn');

  var datasets = [];
  ALL_WY.forEach(function(wy) {
    if (!st.activeYears.has(wy)) return;
    var pts = (st.yearData[wy] || []).map(function(p) { return { x: p.doy, y: p.v }; });
    if (!pts.length) return;
    var isCur = wy === CUR_WY;
    datasets.push({
      label: 'WY' + wy, data: pts,
      borderColor: WY_COLOR[wy] || '#555',
      backgroundColor: 'transparent',
      borderWidth: isCur ? 2.5 : 1.5,
      pointRadius: 0, tension: 0.3,
      order: isCur ? 0 : 1
    });
  });

  if (showMedian && st.medianData && st.medianData.length) {
    datasets.push({
      label: 'Median',
      data: st.medianData.map(function(p) { return { x: p.doy, y: p.v }; }),
      borderColor: warnColor, backgroundColor: 'transparent',
      borderWidth: 1.5, borderDash: [5, 4],
      pointRadius: 0, tension: 0.3, order: -1
    });
  }

  var canvas = document.getElementById('cv-' + sid);
  if (!canvas) return;
  charts[sid] = new Chart(canvas.getContext('2d'), {
    type: 'line', data: { datasets: datasets },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: surfColor, borderColor: borderColor, borderWidth: 1,
          titleColor: mutedColor, bodyColor: textColor,
          callbacks: {
            title: function(items) { return doyLabel(items[0].parsed.x); },
            label: function(item) {
              var v = item.parsed.y;
              return ' ' + item.dataset.label + ': ' + (v != null ? v.toFixed(1) : '\u2014') + '"';
            }
          }
        }
      },
      scales: {
        x: { type: 'linear', min: 1, max: 366,
          ticks: { color: mutedColor, maxTicksLimit: 7, callback: function(v) { return doyLabel(v); } },
          grid: { color: borderColor }, border: { color: borderColor } },
        y: { min: 0,
          ticks: { color: mutedColor, callback: function(v) { return v + '"'; } },
          grid: { color: borderColor }, border: { color: borderColor },
          title: { display: true, text: 'SWE (in)', color: mutedColor } }
      }
    }
  });
}

// ── Per-card year toggles ─────────────────────────────────────────────────
function buildStationToggles(siteNum) {
  var st  = stationState[siteNum];
  var sid = 's' + siteNum;
  var c   = document.getElementById('yt-' + sid);
  if (!st || !c) return;
  c.innerHTML = '';

  var peaks = {};
  ALL_WY.forEach(function(wy) {
    if (wy === CUR_WY) return;
    var rows = st.yearData[wy] || [];
    if (!rows.length) return;
    peaks[wy] = Math.max.apply(null, rows.map(function(r) { return r.v; }));
  });
  var sortedByPeak = Object.keys(peaks).map(Number).sort(function(a, b) { return peaks[b] - peaks[a]; });
  var badges = {};
  if (sortedByPeak.length >= 1) badges[sortedByPeak[0]] = '\u2191';
  if (sortedByPeak.length >= 2) badges[sortedByPeak[sortedByPeak.length - 1]] = '\u2193';
  if (sortedByPeak.length >= 3) {
    var medIdx = Math.floor(sortedByPeak.length / 2);
    var medWy  = sortedByPeak.slice().sort(function(a, b) { return peaks[a] - peaks[b]; })[medIdx];
    if (!badges[medWy]) badges[medWy] = '~';
  }

  ALL_WY.forEach(function(wy) {
    var on  = st.activeYears.has(wy);
    var col = WY_COLOR[wy] || '#555';
    var b   = document.createElement('button');
    b.className = 'yr';
    b.textContent = 'WY' + wy + (badges[wy] ? badges[wy] : '');
    if (on) b.style.cssText = 'border-color:' + col + ';background:' + col + '22;color:' + col + ';font-weight:700';
    if (wy === CUR_WY) {
      b.style.cssText = 'border-color:' + col + ';background:' + col + '22;color:' + col + ';font-weight:700;opacity:.8;cursor:default';
    } else {
      b.onclick = (function(y) {
        return function() {
          if (st.activeYears.has(y)) st.activeYears.delete(y);
          else st.activeYears.add(y);
          buildStationToggles(siteNum);
          renderChart(sid, siteNum);
        };
      })(wy);
    }
    c.appendChild(b);
  });
}

// ── Card DOM ───────────────────────────────────────────────────────────────
function makeCard(s) {
  var sid      = 's' + s.siteNum;
  var nrcsLink = 'https://wcc.sc.egov.usda.gov/nwcc/site?sitenum=' + s.siteNum;
  var elev     = s.elevation ? Math.round(s.elevation).toLocaleString() + ' ft' : '';
  var el       = document.createElement('div');
  el.className = 'card';
  el.innerHTML =
    '<div class="card-hdr">' +
      '<div><div class="sname">' + s.name + '</div>' +
      '<div class="smeta">#' + s.siteNum +
        (elev ? ' \u00b7 ' + elev : '') +
        ' \u00b7 ' + s.dist.toFixed(1) + ' mi</div></div>' +
      '<div class="swe-box">' +
        '<div class="swe-num" id="sv-' + sid + '">\u2014</div>' +
        '<div class="swe-unit">in SWE</div>' +
        '<div class="swe-pct" id="sp-' + sid + '" style="color:var(--muted)">\u2014</div>' +
      '</div>' +
    '</div>' +
    '<div class="chart-wrap">' +
      '<canvas id="cv-' + sid + '"></canvas>' +
      '<div class="overlay" id="ov-' + sid + '">' +
        '<div class="spinner"></div>' +
        '<div class="overlay-msg" id="om-' + sid + '">fetching\u2026</div>' +
      '</div>' +
    '</div>' +
    '<div class="yr-toggles" id="yt-' + sid + '"></div>' +
    '<div class="card-ftr">' +
      '<a href="' + nrcsLink + '" target="_blank">\u2197 NRCS site</a>' +
      '<span class="upd" id="ud-' + sid + '"></span>' +
    '</div>';
  return el;
}

function setOverlay(sid, show, msg, isErr) {
  var ov = document.getElementById('ov-' + sid);
  var om = document.getElementById('om-' + sid);
  if (ov) { if (show) ov.classList.remove('hidden'); else ov.classList.add('hidden'); }
  if (om) { om.textContent = msg || ''; om.className = 'overlay-msg' + (isErr ? ' err' : ''); }
}

// ── Per-station load ───────────────────────────────────────────────────────
function loadStation(s) {
  var sid = 's' + s.siteNum;
  setOverlay(sid, true, 'fetching NRCS data\u2026', false);
  return fetchStation(s)
    .then(function(data) {
      var svEl = document.getElementById('sv-' + sid);
      var spEl = document.getElementById('sp-' + sid);
      var udEl = document.getElementById('ud-' + sid);
      if (svEl) svEl.textContent = data.currentSWE != null ? parseFloat(data.currentSWE).toFixed(1) : '\u2014';
      if (spEl && data.pctMedian != null) {
        var p   = parseInt(data.pctMedian);
        var col = p >= 100 ? 'var(--green)' : p >= 75 ? 'var(--warn)' : 'var(--danger)';
        spEl.innerHTML = '<span style="color:' + col + '">' + p + '% of median</span>';
      }
      if (udEl && data.currentDate) {
        var d = new Date(data.currentDate + 'T12:00:00');
        udEl.textContent = 'updated ' + d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      }
      buildStationToggles(s.siteNum);
      renderChart(sid, s.siteNum);
      setOverlay(sid, false, '', false);
    })
    .catch(function(e) {
      console.error('Site ' + s.siteNum, e);
      setOverlay(sid, true, 'Error: ' + e.message, true);
    });
}

// ── Main load ──────────────────────────────────────────────────────────────
function loadAll() {
  showMedian = document.getElementById('medSel').value === '1';
  var btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  document.getElementById('status').textContent = 'Fetching ' + STATIONS.length + ' stations from NRCS\u2026';
  var t0 = Date.now();
  Promise.all(STATIONS.map(loadStation)).then(function() {
    var elapsed = ((Date.now() - t0) / 1000).toFixed(1);
    document.getElementById('status').textContent =
      'Loaded in ' + elapsed + 's \u00b7 NRCS SNOTEL (wcc.sc.egov.usda.gov)';
    document.getElementById('ftTime').textContent =
      'Refreshed: ' + new Date().toLocaleTimeString();
    btn.disabled = false;
  });
}

// ── Init ───────────────────────────────────────────────────────────────────
document.getElementById('curWyLegend').textContent = 'WY' + CUR_WY;
try {
  loadStations();
} catch(e) {
  document.getElementById('status').textContent = 'Init error: ' + e.message;
  console.error('Init failed:', e);
}
</script>
